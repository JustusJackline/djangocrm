{% block content %}

   {% if user.is_authenticated %}
  
   <h3>Update record</h3>

    <form method="POST" action="{% url 'update_record' customer_record.id %}">
     {% csrf_token %}
     {{ form.as_p}}
     <button type="submit"
 class="btn btn-outline-success"
 >Update</button>
    </form>
{% endif %}
    {% endblock %}
